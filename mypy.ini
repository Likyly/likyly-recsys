# Type-checked scope: the new/rewritten API-layer modules. app.py and the pandas engine are
# untyped legacy (star imports, DataFrames) and are followed silently, not checked.
[mypy]
python_version = 3.13
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
mypy_path = application/api:application/utils
explicit_package_bases = True

[mypy-app]
ignore_errors = True
