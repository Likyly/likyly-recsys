# Publishes the Ruby SDK (sdk/ruby) to RubyGems with Trusted Publishing: no API key is stored, RubyGems
# checks that the run comes from this workflow (set once on rubygems.org: likyly > Trusted publishers >
# GitHub Actions, Likyly / likyly-recsys / release-rubygems.yml).
#
# Release: set VERSION in sdk/ruby/lib/likyly/version.rb, commit, then:
#   git tag ruby-v1.0.1 && git push origin ruby-v1.0.1
name: release-rubygems

on:
  push:
    tags: ["ruby-v*"]

permissions:
  contents: read
  id-token: write # Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/ruby } }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: sdk/ruby }

      - name: The tag matches the gem version
        id: gem
        run: |
          declared=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' lib/likyly/version.rb)
          [ "ruby-v$declared" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but version.rb says $declared"; exit 1; }
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - run: bundle exec rake test
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: gem build likyly.gemspec && gem push "likyly-${{ steps.gem.outputs.version }}.gem"
