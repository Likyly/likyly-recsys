name: Deploy to DigitalOcean

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Serializes deploys - two overlapping runs used to race (one's `docker rm -f
# recsys-api` killing the container the other had just built and started),
# causing a real production outage on 2026-09-02. A queued run waits instead of
# running concurrently; cancel-in-progress stays false so a build never gets cut
# off mid-way.
concurrency:
  group: deploy-recsys-api
  cancel-in-progress: false

jobs:
  # Nothing is pushed or deployed unless this passes. The tests run INSIDE the production image
  # (same Python, same pinned dependencies as what will actually serve traffic) against a
  # throwaway Postgres+pgvector - never against the production database.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: likyly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d likyly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Lint
        run: |
          pip install --quiet ruff==0.16.8
          ruff check .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cached, reused by the push job)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: recsys-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Type-check and run the test suite in the image
        run: |
          docker run --rm --network host \
            -e TEST_DATABASE_URL=postgresql://test:test@localhost:5432/likyly_test \
            -w /srv recsys-api:test \
            sh -c "pip install --quiet pytest==9.1.1 mypy==2.3.1 \
              && mypy application/api/ids.py application/api/observability.py application/api/schemas.py \
                      application/api/ingestion.py application/api/recommender.py application/utils/migrate.py \
              && pytest -q"

      - name: docs/openapi.json is up to date
        run: |
          docker run --rm --network host \
            -e TEST_DATABASE_URL=postgresql://test:test@localhost:5432/likyly_test \
            -v "$PWD/docs:/out" -w /srv recsys-api:test \
            sh -c "python scripts/export_openapi.py && cp docs/openapi.json /out/openapi.generated.json"
          diff docs/openapi.json docs/openapi.generated.json

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/likyly/recsys-api:latest
          cache-from: type=gha

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DIGITALOCEAN_DEPLOY_KEY }}

      - name: Write recsys .env (remote)
        run: |
          # Lives outside ~/app/recsys (no longer rsynced - the image is built in CI
          # now) and is bind-mounted into the container at runtime by docker-compose.yml,
          # not baked into the image - keeps secrets out of the pushed image layers.
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} "mkdir -p ~/app/recsys-env/application/api"
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} 'cat > ~/app/recsys-env/application/api/.env' <<ENV
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT=production
          ENV

      - name: Pull and restart recsys-api (remote)
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} 'bash -se' <<'EOF'
          set -euo pipefail

          # ghcr.io/likyly/recsys-api is private - log in with this job's own
          # GITHUB_TOKEN (packages: read is enough, no long-lived PAT to create/rotate).
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Built on GitHub Actions' runner and pulled here, not built on the droplet
          # itself - this box has a small disk (25GB) shared with several other
          # services, and building recsys-api's heavy ML deps (torch, sentence-
          # transformers) locally repeatedly filled it, causing both a rsync failure
          # and a production outage on 2026-09-02.
          cd ~/app/licenses
          docker compose pull recsys-api
          docker compose up -d recsys-api
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

          docker image prune -af
          df -h /
          EOF
