name: Deploy to DigitalOcean

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The image is built ONCE, in the test job: loaded locally for the tests and pushed as
# ghcr.io/likyly/recsys-api:<commit sha> in the same build. Only the deploy job promotes it to
# :latest, so an image whose tests failed never reaches production.
#
# Deploys are serialized (concurrency on the deploy job only): two overlapping deploys used to
# race (one's `docker rm -f recsys-api` killing the container the other had just started),
# causing a real production outage on 2026-09-02. The tests of a new push no longer wait for
# the previous run, only its deploy does. GitHub keeps one pending deploy per group: a newer
# push replaces the one waiting, never the one running.

env:
  IMAGE: ghcr.io/likyly/recsys-api

jobs:
  # Nothing is deployed unless this passes. The tests run INSIDE the production image
  # (same Python, same pinned dependencies as what will actually serve traffic) against a
  # throwaway Postgres+pgvector - never against the production database.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: likyly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d likyly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Lint
        run: |
          pip install --quiet ruff==0.16.8
          ruff check .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image once (loaded for the tests, pushed as the commit's tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Type-check and run the test suite in the image
        run: |
          docker run --rm --network host \
            -e TEST_DATABASE_URL=postgresql://test:test@localhost:5432/likyly_test \
            -w /srv "$IMAGE:${{ github.sha }}" \
            sh -c "pip install --quiet pytest==9.1.1 mypy==2.3.1 \
              && mypy application/api/ids.py application/api/observability.py application/api/schemas.py \
                      application/api/ingestion.py application/api/recommender.py application/utils/migrate.py \
              && pytest -q"

      - name: docs/openapi.json is up to date
        run: |
          docker run --rm --network host \
            -e TEST_DATABASE_URL=postgresql://test:test@localhost:5432/likyly_test \
            -v "$PWD/docs:/out" -w /srv "$IMAGE:${{ github.sha }}" \
            sh -c "python scripts/export_openapi.py && cp docs/openapi.json /out/openapi.generated.json"
          diff docs/openapi.json docs/openapi.generated.json

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-recsys-api
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      # Tests now run in parallel across pushes, so an older run can reach this point after a
      # newer one: it then steps aside and lets the newer commit's run deploy.
      - name: Still the latest commit of the branch?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.ref_name }} is now at $head: its own run deploys it, this one is skipped."
          fi

      - name: Log in to GHCR
        if: steps.latest.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested image to :latest
        if: steps.latest.outputs.deploy == 'true'
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ github.sha }}"

      - name: Setup SSH
        if: steps.latest.outputs.deploy == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DIGITALOCEAN_DEPLOY_KEY }}

      - name: Write recsys .env (remote)
        if: steps.latest.outputs.deploy == 'true'
        run: |
          # Lives outside ~/app/recsys (no longer rsynced - the image is built in CI
          # now) and is bind-mounted into the container at runtime by docker-compose.yml,
          # not baked into the image - keeps secrets out of the pushed image layers.
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} "mkdir -p ~/app/recsys-env/application/api"
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} 'cat > ~/app/recsys-env/application/api/.env' <<ENV
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          SMTP_SECURITY=${{ secrets.SMTP_SECURITY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT=production
          TEAM_ALERT_WEBHOOK_URL=${{ secrets.TEAM_ALERT_WEBHOOK_URL }}
          ENV

      - name: Pull and restart recsys-api (remote)
        if: steps.latest.outputs.deploy == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} 'bash -se' <<'EOF'
          set -euo pipefail

          # ghcr.io/likyly/recsys-api is private - log in with this job's own
          # GITHUB_TOKEN (packages: read is enough, no long-lived PAT to create/rotate).
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Built on GitHub Actions' runner and pulled here, not built on the droplet
          # itself - this box has a small disk (25GB) shared with several other
          # services, and building recsys-api's heavy ML deps (torch, sentence-
          # transformers) locally repeatedly filled it, causing both a rsync failure
          # and a production outage on 2026-09-02.
          # Own compose project, written from this repo on every deploy. It used to be a
          # service of ~/app/licenses/docker-compose.yml, but that folder is rsynced
          # (--delete) from the licenses repo, which wiped the service on 2026-11-02.
          # Joins the licenses_web network so Caddy still reaches it as recsys-api:6061,
          # and reuses the existing model volume.
          cd ~/app/recsys-env
          cat > docker-compose.yml <<'COMPOSE'
          name: recsys-api
          services:
            recsys-api:
              image: ghcr.io/likyly/recsys-api:latest
              container_name: recsys-api
              expose:
                - "6061"
              volumes:
                - ./application/api/.env:/srv/application/api/.env:ro
                - recsys_model_data:/srv/model
              networks: [web]
              restart: unless-stopped
          networks:
            web:
              name: licenses_web
              external: true
          volumes:
            recsys_model_data:
              name: licenses_recsys_model_data
              external: true
          COMPOSE
          docker compose pull recsys-api
          # One-time migration: the running container still belongs to the old "licenses"
          # compose project and holds the recsys-api name. No-op afterwards.
          if [ "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' recsys-api 2>/dev/null)" = "licenses" ]; then
            docker rm -f recsys-api
          fi
          docker compose up -d recsys-api
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

          docker image prune -af
          df -h /
          EOF
