name: Deploy to DigitalOcean

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DIGITALOCEAN_DEPLOY_KEY }}

      - name: Rsync recsys repo to droplet
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} "mkdir -p ~/app/recsys"
          rsync -avz --delete --exclude '.DS_Store' --exclude '.git' --exclude '.github' ./ deployer@${{ secrets.DIGITALOCEAN_HOST }}:~/app/recsys/

      - name: Write recsys .env (remote)
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} "mkdir -p ~/app/recsys/application/api"
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} 'cat > ~/app/recsys/application/api/.env' <<ENV
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT=production
          ENV

      - name: Rebuild only recsys service (remote)
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DIGITALOCEAN_HOST }} 'bash -se' <<'EOF'
          set -euo pipefail

          # Install Docker if missing
          command -v docker >/dev/null 2>&1 || curl -fsSL https://get.docker.com | sh

          # The actual compose project lives in ~/app/licenses (it defines the `recsys`
          # service building from the ../recsys context rsynced above) - NOT ~/app/recsys,
          # which only holds the build context, no docker-compose.yml of its own.
          cd ~/app/licenses

          if [ -n "$(docker ps -aq -f name=recsys-api)" ]; then
            docker rm -f recsys-api
          else
            echo "Container recsys-api not present"
          fi

          docker compose build recsys-api
          docker compose up -d recsys-api
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

          # This droplet has a small disk (25GB) and recsys-api builds *on* it every
          # deploy - the build cache and superseded image layers pile up fast enough to
          # fill it within a couple dozen deploys (this is what caused the "No space
          # left on device" rsync failure on 2026-09-02). Safe to run unconditionally
          # right after the new container is up: -a only removes images/cache not
          # referenced by any container, running or stopped.
          docker image prune -af
          docker builder prune -af
          df -h /
          EOF
