# Publishes the Python SDK (sdk/python) to PyPI with Trusted Publishing: no token is stored, PyPI checks
# that the run comes from this workflow (set once on pypi.org: likyly > Settings > Publishing > GitHub,
# Likyly / likyly-recsys / release-pypi.yml).
#
# Release: set __version__ in sdk/python/src/likyly/_version.py, commit, then:
#   git tag python-v1.0.1 && git push origin python-v1.0.1
name: release-pypi

on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read
  id-token: write # Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: The tag matches the package version
        run: |
          declared=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/likyly/_version.py)
          [ "python-v$declared" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but _version.py says $declared"; exit 1; }

      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: sdk/python/dist }
