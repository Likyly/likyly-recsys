# Publishes the .NET SDK (sdk/dotnet) to NuGet with Trusted Publishing: no API key is stored, GitHub proves
# who is publishing and NuGet hands out a short-lived key (policy "likyly-publish" on nuget.org).
#
# Release: set <Version> in sdk/dotnet/src/Likyly/Likyly.csproj, commit, then push a tag that matches it:
#   git tag dotnet-v1.0.0 && git push origin dotnet-v1.0.0
# The repository variable NUGET_USER holds the nuget.org user name that owns the policy.
name: release-nuget

on:
  push:
    tags: ["dotnet-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing: lets NuGet check this run comes from this workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/dotnet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }

      - name: The tag matches the project version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Likyly/Likyly.csproj)
          [ "dotnet-v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Likyly.csproj says $version"; exit 1; }

      - run: dotnet test tests/Likyly.Tests --nologo
      - run: dotnet pack src/Likyly -c Release -o out --nologo

      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}

      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
