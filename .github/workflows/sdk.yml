name: SDKs

# @likyly/wizard, the only package left here: the SDKs and the MCP server live in https://github.com/Likyly/sdks.
on:
  pull_request:
    paths: ["sdk/**", "docs/SKILL.md", ".github/workflows/sdk.yml"]
  push:
    branches: [main]
    paths: ["sdk/**", "docs/SKILL.md", ".github/workflows/sdk.yml"]

permissions:
  contents: read

jobs:
  wizard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/wizard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
