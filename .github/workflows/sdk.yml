name: SDKs

# Unit + conformance tests for the eight SDKs (no network: a scripted transport plays the API), the shared
# scenarios checked against the committed OpenAPI, and the generated documentation checked for drift.
# The live tests (against a real API) and the examples run locally: sdk/conformance/local-api.sh + run-examples.sh.
on:
  pull_request:
    paths: ["sdk/**", "docs/openapi.json", ".github/workflows/sdk.yml"]
  push:
    branches: [main]
    paths: ["sdk/**", "docs/openapi.json", ".github/workflows/sdk.yml"]

permissions:
  contents: read

jobs:
  contract:
    name: Scenarios match the OpenAPI + docs are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - run: python sdk/conformance/validate_against_openapi.py docs/openapi.json
      - run: node sdk/docs/generate.mjs --check --website /nonexistent

  typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test

  react:
    # @likyly/react depends on @likyly/sdk via a local file: reference (not published to npm
    # yet - see sdk/react/README.md) - sdk/js must be built first so that dependency resolves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: sdk/js
      - run: npm install && npm run build && npm test
        working-directory: sdk/react

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/python } }
    strategy:
      matrix: { python: ["3.9", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q

  php:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/php } }
    strategy:
      matrix: { php: ["8.1", "8.4"] }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ matrix.php }}", tools: composer }
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test

  java:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B test

  dotnet:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/dotnet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test tests/Likyly.Tests --nologo

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  ruby:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/ruby } }
    strategy:
      matrix: { ruby: ["3.0", "3.3"] }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "${{ matrix.ruby }}", bundler-cache: true, working-directory: sdk/ruby }
      - run: bundle exec rake test

  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
