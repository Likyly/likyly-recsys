# Publishes @likyly/wizard (sdk/wizard) to npm with Trusted Publishing: no token is stored, npm checks that the
# run comes from this workflow (set once on npmjs.com: Settings > Trusted Publisher > GitHub Actions,
# Likyly / likyly-recsys / release-npm.yml).
#
# Release: set "version" in sdk/wizard/package.json, commit, then push a tag wizard-v<version> (e.g. wizard-v0.7.4).
# The SDKs (@likyly/sdk, @likyly/react, @likyly/mcp-server...) are released from https://github.com/Likyly/sdks.
name: release-npm

on:
  push:
    tags: ["wizard-v*"]

permissions:
  contents: read
  id-token: write # Trusted Publishing, and the provenance statement npm attaches to the package

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # Trusted Publishing needs npm 11.5.1 or later

      - name: The tag names a package and matches its version
        id: pkg
        run: |
          folder=${GITHUB_REF_NAME%-v*}
          version=${GITHUB_REF_NAME##*-v}
          dir=sdk/$folder
          [ -f "$dir/package.json" ] || { echo "no package in $dir"; exit 1; }
          declared=$(node -p "require('./$dir/package.json').version")
          [ "$declared" = "$version" ] || { echo "tag $GITHUB_REF_NAME but $dir/package.json says $declared"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: npm run build --if-present
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: npm test --if-present
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: npm publish --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
