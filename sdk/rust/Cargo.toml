[package]
name = "likyly"
version = "1.0.0"
edition = "2021"
description = "Official Rust client for the LIKYLY recommendations API"
license = "MIT"
homepage = "https://likyly.com"
documentation = "https://docs.rs/likyly"
readme = "README.md"
keywords = ["recommendations", "recommender", "ecommerce", "likyly", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
