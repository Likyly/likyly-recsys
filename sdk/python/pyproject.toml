[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "likyly"
dynamic = ["version"]
description = "Official LIKYLY SDK for Python: items, users, events and recommendations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["recommendations", "recommender", "personalization", "likyly"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.version]
path = "src/likyly/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/likyly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# the examples are cut into documentation snippets by region markers, which sit right after the imports
"examples/*" = ["I001"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/likyly"]
