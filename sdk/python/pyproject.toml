[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "likyly"
dynamic = ["version"]
description = "Product recommendations for your site (\"You may also like\", \"Recommended for you\"), learned from what your visitors do. Official LIKYLY client for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["likyly", "recommendations", "product recommendations", "recommender", "personalization", "ecommerce"]
authors = [{ name = "LIKYLY" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://www.likyly.com"
Documentation = "https://likyly.com/docs/sdk/python"
Source = "https://github.com/Likyly/likyly-recsys/tree/main/sdk/python"
Issues = "https://github.com/Likyly/likyly-recsys/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.version]
path = "src/likyly/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/likyly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# the examples are cut into documentation snippets by region markers, which sit right after the imports
"examples/*" = ["I001"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/likyly"]
